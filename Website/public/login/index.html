<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="{{faviconUrl}}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - {{siteName}}</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #f3f0e8;
        --muted: #c6c4b7;
        --line: rgba(255, 255, 255, 0.14);
        --gold: #d7b45f;
        --discord: #5865f2;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(circle at 70% 24%, rgba(88, 101, 242, 0.24), transparent 28rem),
          linear-gradient(150deg, #101411 0%, #1a2420 52%, #2b2519 100%);
      }
      .card {
        width: min(460px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        background: rgba(19, 29, 23, 0.88);
        box-shadow: 0 28px 80px rgba(0,0,0,0.32);
      }
      h1 {
        margin: 0;
        font-size: 2.2rem;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      a {
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 6px;
        padding: 11px 15px;
        font-weight: 800;
        text-decoration: none;
        display: inline-flex;
        justify-content: center;
      }
      .primary {
        background: var(--discord);
        color: white;
      }
      .secondary {
        background: rgba(255,255,255,0.05);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Log in</h1>
      <p>Use Discord to access your {{siteName}} profile and linked Minecraft account information.</p>
      <div class="actions">
        <a class="primary" href="{{oauthHref}}">Continue with Discord</a>
        <a class="secondary" href="/">Back home</a>
      </div>
    </main>
  </body>
</html>
