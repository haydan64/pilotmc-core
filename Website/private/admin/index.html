<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - PilotMC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101411;
        --panel: #17211b;
        --panel-2: #1d2a22;
        --text: #f4f0e7;
        --muted: #c9c0ac;
        --line: rgba(255,255,255,0.14);
        --gold: #d7b45f;
        --green: #79c884;
        --red: #df7468;
        --ink: #0e120f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: linear-gradient(150deg, #101411 0%, #19231d 55%, #272114 100%);
      }
      button, input, textarea {
        font: inherit;
      }
      button {
        border: 1px solid rgba(215,180,95,0.56);
        background: var(--gold);
        color: var(--ink);
        border-radius: 6px;
        padding: 9px 12px;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
      }
      button.danger {
        background: var(--red);
        border-color: var(--red);
        color: #160907;
      }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0f1511;
        color: var(--text);
        padding: 10px;
      }
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid var(--line);
        background: rgba(15, 20, 17, 0.86);
        padding: 22px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        margin-bottom: 26px;
      }
      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }
      .nav-group {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }
      .nav-label {
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 10px 0 4px;
      }
      .nav-item {
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--text);
        border-color: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-item.active {
        border-color: rgba(215,180,95,0.46);
        background: rgba(215,180,95,0.14);
      }
      .subnav {
        display: grid;
        gap: 6px;
        padding-left: 12px;
      }
      .main {
        padding: 28px;
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }
      h1, h2, h3, p { margin-top: 0; }
      .muted { color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .two {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);
        gap: 14px;
      }
      .panel {
        border: 1px solid var(--line);
        background: rgba(23, 33, 27, 0.88);
        border-radius: 8px;
        padding: 18px;
      }
      .metric {
        display: grid;
        gap: 6px;
      }
      .metric span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .metric strong {
        font-size: 1.55rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 9px;
        background: #101611;
        border: 1px solid var(--line);
        color: var(--muted);
        font-weight: 800;
        white-space: nowrap;
      }
      .pill.ok { color: var(--green); }
      .pill.bad { color: var(--red); }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 0.86rem;
      }
      tr.clickable { cursor: pointer; }
      tr.clickable:hover { background: rgba(215,180,95,0.08); }
      .player-list {
        display: grid;
        gap: 8px;
      }
      .player-row {
        border: 1px solid var(--line);
        background: #111811;
        border-radius: 6px;
        padding: 10px;
        text-align: left;
        color: var(--text);
      }
      .player-row.active {
        border-color: var(--gold);
      }
      .details {
        display: grid;
        gap: 12px;
      }
      .fact {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .fact span {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .fact strong {
        display: block;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .hidden { display: none !important; }
      .output {
        min-height: 38px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar { position: static; height: auto; }
        .grid, .two { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .main { padding: 18px 14px; }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .users-table {
          min-width: 0;
        }
        .users-table th,
        .users-table td {
          padding: 10px 8px;
        }
        .users-table .hide-mobile {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span>PilotMC Admin</span>
        </div>
        <div class="nav-group">
          <button class="nav-item active" data-view="general">General</button>
          <button class="nav-item" data-view="backend">Backend</button>
          <button class="nav-item" data-view="discord">Discord Bot</button>
        </div>
        <div class="nav-label">Minecraft</div>
        <div id="minecraftNav" class="subnav"></div>
        <div class="nav-label">People</div>
        <div class="nav-group">
          <button class="nav-item" data-view="users">Users</button>
        </div>
        <div class="nav-group">
          <a class="nav-item" href="/profile">Profile</a>
          <a class="nav-item" href="/logout">Log out</a>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h1 id="pageTitle">General</h1>
            <p class="muted">Signed in as {{displayName}}.</p>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </div>

        <section id="view-general" class="view">
          <div id="generalGrid" class="grid"></div>
        </section>

        <section id="view-backend" class="view hidden">
          <div id="backendGrid" class="grid"></div>
        </section>

        <section id="view-discord" class="view hidden">
          <div id="discordGrid" class="grid"></div>
          <section class="panel" style="margin-top:14px">
            <h2>Configuration</h2>
            <div id="discordConfig" class="output"></div>
          </section>
        </section>

        <section id="view-minecraft" class="view hidden">
          <div id="serverSummary" class="grid"></div>
          <div class="two" style="margin-top:14px">
            <section class="panel">
              <h2>Players</h2>
              <div id="playerList" class="player-list"></div>
            </section>
            <section class="panel">
              <h2 id="playerTitle">Player</h2>
              <div id="playerDetails" class="details muted">Select a player.</div>
            </section>
          </div>
        </section>

        <section id="view-users" class="view hidden">
          <div class="two">
            <section class="panel">
              <h2>Users</h2>
              <div class="table-wrap">
                <table class="users-table">
                  <thead>
                    <tr>
                      <th>Discord user</th>
                      <th>Minecraft</th>
                      <th class="hide-mobile">Application</th>
                      <th>Joined</th>
                    </tr>
                  </thead>
                  <tbody id="usersTable"></tbody>
                </table>
              </div>
            </section>
            <section class="panel">
              <h2>User Details</h2>
              <div id="userDetails" class="details muted">Select a user.</div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script>
      const state = {
        view: 'general',
        servers: [],
        selectedServerKey: null,
        selectedPlayerName: null,
        currentPlayers: [],
        selectedUserId: null,
        users: [],
        applicationQuestions: []
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDate(value) {
        if (!value) return 'Unknown';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Unknown' : date.toLocaleString();
      }

      function formatDuration(seconds) {
        const total = Number(seconds || 0);
        const days = Math.floor(total / 86400);
        const hours = Math.floor((total % 86400) / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        if (days) return `${days}d ${hours}h`;
        if (hours) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          },
          body: options.body ? JSON.stringify(options.body) : undefined
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        return payload;
      }

      function metric(label, value, status) {
        const cls = status === true ? 'ok' : status === false ? 'bad' : '';
        return `<section class="panel metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong>${status !== undefined ? `<em class="pill ${cls}">${status ? 'Online' : 'Unavailable'}</em>` : ''}</section>`;
      }

      function setView(view, serverKey) {
        state.view = view;
        if (serverKey) state.selectedServerKey = serverKey;
        $$('.view').forEach((node) => node.classList.add('hidden'));
        $(`#view-${view === 'minecraft' ? 'minecraft' : view}`).classList.remove('hidden');
        updateNavigationState();
        $('#pageTitle').textContent = view === 'minecraft'
          ? (state.servers.find((server) => server.serverKey === state.selectedServerKey)?.displayName || 'Minecraft')
          : view.replace(/^./, (letter) => letter.toUpperCase());
        refresh();
      }

      function updateNavigationState() {
        $$('.sidebar .nav-item').forEach((node) => {
          const isServerButton = Boolean(node.dataset.serverKey);
          const isActiveServer = state.view === 'minecraft' && isServerButton && node.dataset.serverKey === state.selectedServerKey;
          const isActivePage = !isServerButton && node.dataset.view === state.view;
          node.classList.toggle('active', isActiveServer || isActivePage);
        });
      }

      function renderMinecraftNav() {
        $('#minecraftNav').innerHTML = state.servers.map((server) => `
          <button class="nav-item" data-view="minecraft" data-server-key="${escapeHtml(server.serverKey)}">
            <span>${escapeHtml(server.displayName)}</span>
            <span class="pill ${server.available ? 'ok' : 'bad'}">${server.playerCount || 0}</span>
          </button>
        `).join('') || '<span class="muted">No servers.</span>';
        $$('#minecraftNav .nav-item').forEach((button) => {
          button.addEventListener('click', () => setView('minecraft', button.dataset.serverKey));
        });
        updateNavigationState();
      }

      async function loadGeneral() {
        const data = await api('/admin/api/general');
        $('#generalGrid').innerHTML = [
          metric('Website', data.website.service, true),
          metric('Website uptime', formatDuration(data.website.uptimeSeconds)),
          metric('Backend connection', data.website.backendConnected ? 'Connected' : 'Unavailable', data.website.backendConnected),
          metric('Authentication', data.website.auth),
          metric('Public URL', data.website.publicUrl || 'Not configured'),
          metric('Minecraft servers', data.backend.minecraftServers ?? 'Unknown')
        ].join('');
      }

      async function loadBackend() {
        const data = await api('/admin/api/backend');
        $('#backendGrid').innerHTML = [
          metric('Backend', data.service || 'pilotmc-backend', true),
          metric('Uptime', formatDuration(data.uptimeSeconds)),
          metric('Database', data.database || 'Unknown'),
          metric('Minecraft servers', data.minecraftServers ?? 'Unknown'),
          metric('Checked', formatDate(data.checkedAt))
        ].join('');
      }

      async function loadDiscord() {
        const data = await api('/admin/api/discord');
        const status = data.status || {};
        const guild = status.guilds?.[0] || {};
        $('#discordGrid').innerHTML = [
          metric('Discord bot', status.username || 'Unknown', status.online),
          metric('Uptime', formatDuration(status.uptimeSeconds)),
          metric('Cached members', guild.cachedMembers ?? 'Unknown'),
          metric('Commands loaded', status.commands?.length ?? 0)
        ].join('');
        $('#discordConfig').textContent = JSON.stringify(status.config || {}, null, 2);
      }

      async function loadMinecraftList() {
        const data = await api('/admin/api/minecraft');
        state.servers = data.servers || [];
        if (!state.selectedServerKey && state.servers[0]) state.selectedServerKey = state.servers[0].serverKey;
        renderMinecraftNav();
      }

      function playerName(player) {
        return player.name || player.username || player.minecraftUsername || player.playerName || 'Unknown';
      }

      function playerOnline(player) {
        return player.online !== false;
      }

      function setTextIfChanged(element, value) {
        const text = String(value ?? '');
        if (element && element.textContent !== text) element.textContent = text;
      }

      function setHtmlIfChanged(element, html) {
        if (element && element.innerHTML !== html) element.innerHTML = html;
      }

      function renderPlayerDetails(serverKey, player, force = false) {
        if (!player) {
          if (!force && state.selectedPlayerName) return;
          $('#playerTitle').textContent = 'Player';
          $('#playerDetails').innerHTML = 'Select a player.';
          delete $('#playerDetails').dataset.playerName;
          return;
        }
        const name = playerName(player);
        const location = Array.isArray(player.location)
          ? player.location.map((value) => Number(value).toFixed(1)).join(', ')
          : player.location ? JSON.stringify(player.location) : 'Unknown';
        const health = player.health !== undefined && player.health !== null
          ? `${player.health}${player.maxHealth !== undefined && player.maxHealth !== null ? ` / ${player.maxHealth}` : ''}`
          : 'Unknown';
        const gameMode = player.gamemode || player.gameMode || 'Unknown';
        const details = $('#playerDetails');
        if (!force && details.dataset.playerName === name) {
          setTextIfChanged($('#playerTitle'), name);
          setTextIfChanged(details.querySelector('[data-player-field="status"]'), playerOnline(player) ? 'Online' : 'Offline');
          setTextIfChanged(details.querySelector('[data-player-field="gamemode"]'), gameMode);
          setTextIfChanged(details.querySelector('[data-player-field="health"]'), health);
          setTextIfChanged(details.querySelector('[data-player-field="dimension"]'), player.dimension || 'Unknown');
          setTextIfChanged(details.querySelector('[data-player-field="position"]'), location);
          return;
        }
        const messageId = `message-${Date.now()}`;
        $('#playerTitle').textContent = name;
        details.dataset.playerName = name;
        details.innerHTML = `
          <div class="fact"><span>Status</span><strong data-player-field="status">${playerOnline(player) ? 'Online' : 'Offline'}</strong></div>
          <div class="fact"><span>Gamemode</span><strong data-player-field="gamemode">${escapeHtml(gameMode)}</strong></div>
          <div class="fact"><span>Health</span><strong data-player-field="health">${escapeHtml(health)}</strong></div>
          <div class="fact"><span>Dimension</span><strong data-player-field="dimension">${escapeHtml(player.dimension || 'Unknown')}</strong></div>
          <div class="fact"><span>Position</span><strong data-player-field="position">${escapeHtml(location)}</strong></div>
          <div class="fact"><span>Message</span><textarea id="${messageId}" rows="3" placeholder="Message to send in Minecraft"></textarea></div>
          <div class="actions">
            <button class="secondary" data-player-action="message">Send Message</button>
            <button class="secondary" data-player-action="inventory">Inventory / Ender Chest</button>
            <button class="danger" data-player-action="kick">Kick</button>
            <button class="danger" data-player-action="unwhitelist">Unwhitelist</button>
          </div>
          <div id="playerActionOutput" class="output"></div>
        `;
        $$('[data-player-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const output = $('#playerActionOutput');
            output.textContent = 'Working...';
            try {
              if (button.dataset.playerAction === 'inventory') {
                const result = await api(`/admin/api/minecraft/${encodeURIComponent(serverKey)}/player/${encodeURIComponent(name)}/action`, {
                  method: 'POST',
                  body: { action: 'inventory' }
                });
                output.innerHTML = renderInventory(result);
                return;
              }
              const body = {
                action: button.dataset.playerAction,
                message: document.getElementById(messageId)?.value || ''
              };
              const result = await api(`/admin/api/minecraft/${encodeURIComponent(serverKey)}/player/${encodeURIComponent(name)}/action`, {
                method: 'POST',
                body
              });
              output.textContent = JSON.stringify(result, null, 2);
            } catch (err) {
              output.textContent = err.message;
            }
          });
        });
      }

      function renderItem(item) {
        const enchants = Array.isArray(item.enchants) && item.enchants.length
          ? ` | enchants: ${item.enchants.map((entry) => `${entry.id} ${entry.level}`).join(', ')}`
          : '';
        const lore = Array.isArray(item.lore) && item.lore.length
          ? ` | lore: ${item.lore.join(' / ')}`
          : '';
        return `slot ${item.slot}: ${item.typeId || 'unknown'} x${item.amount || 1}${item.nameTag ? ` (${item.nameTag})` : ''}${enchants}${lore}`;
      }

      function renderInventory(player) {
        const inventory = Array.isArray(player.inventory) ? player.inventory : [];
        const enderChest = Array.isArray(player.enderChest) ? player.enderChest : [];
        return `
          <strong>Inventory</strong>
          <pre>${escapeHtml(inventory.length ? inventory.map(renderItem).join('\n') : 'No inventory items reported.')}</pre>
          <strong>Ender Chest</strong>
          <pre>${escapeHtml(enderChest.length ? enderChest.map(renderItem).join('\n') : 'No ender chest items reported. If this stays empty, Bedrock is not exposing that container to the link addon.')}</pre>
        `;
      }

      function reconcilePlayerList(players) {
        const list = $('#playerList');
        const wantedNames = new Set(players.map(playerName));
        list.querySelectorAll('.player-row').forEach((row) => {
          if (!wantedNames.has(row.dataset.player)) row.remove();
        });
        list.querySelectorAll('[data-empty-player-list]').forEach((node) => node.remove());

        for (const player of players) {
          const name = playerName(player);
          let row = Array.from(list.querySelectorAll('.player-row')).find((entry) => entry.dataset.player === name);
          if (!row) {
            row = document.createElement('button');
            row.className = 'player-row';
            row.dataset.player = name;
            row.innerHTML = '<strong></strong><br><span class="muted"></span>';
            row.addEventListener('click', () => {
              state.selectedPlayerName = row.dataset.player;
              const selected = state.currentPlayers.find((entry) => playerName(entry) === state.selectedPlayerName);
              renderPlayerDetails(state.selectedServerKey, selected, true);
              $$('.player-row').forEach((entry) => entry.classList.toggle('active', entry.dataset.player === state.selectedPlayerName));
            });
          }
          setTextIfChanged(row.querySelector('strong'), name);
          setTextIfChanged(row.querySelector('span'), `${player.gamemode || player.gameMode || 'Unknown'} - ${player.dimension || 'Unknown'}`);
          row.classList.toggle('active', name === state.selectedPlayerName);
          list.appendChild(row);
        }
        if (!players.length) {
          const empty = document.createElement('p');
          empty.className = 'muted';
          empty.dataset.emptyPlayerList = 'true';
          empty.textContent = 'No player list has been received yet.';
          list.appendChild(empty);
        }
      }

      async function loadMinecraftServer({ fullRefresh = false } = {}) {
        if (!state.selectedServerKey) {
          $('#serverSummary').innerHTML = metric('Minecraft', 'No server selected', false);
          $('#playerList').innerHTML = '';
          renderPlayerDetails(null, null, fullRefresh);
          return;
        }
        const data = await api(`/admin/api/minecraft/${encodeURIComponent(state.selectedServerKey)}`);
        const server = data.server || {};
        const players = (server.players || []).slice().sort((a, b) => Number(playerOnline(b)) - Number(playerOnline(a)) || playerName(a).localeCompare(playerName(b)));
        state.currentPlayers = players;
        setHtmlIfChanged($('#serverSummary'), [
          metric('Server', server.displayName || state.selectedServerKey, server.available),
          metric('Uptime', formatDuration(server.status?.bds?.uptimeSeconds || server.status?.uptimeSeconds)),
          metric('Players online', players.filter(playerOnline).length),
          metric('Last player update', formatDate(server.playersReceivedAt))
        ].join(''));
        reconcilePlayerList(players);
        const selected = players.find((player) => playerName(player) === state.selectedPlayerName);
        renderPlayerDetails(state.selectedServerKey, selected || null, fullRefresh);
      }

      async function loadUsers() {
        const data = await api('/admin/api/users');
        const users = data.users || [];
        state.users = users;
        state.applicationQuestions = data.questions || [];
        $('#usersTable').innerHTML = users.map((user) => `
          <tr class="clickable" data-user-id="${escapeHtml(user.discordUserId)}">
            <td>${escapeHtml(user.discord?.username ? `@${user.discord.username}` : 'Unknown Discord user')}</td>
            <td>${escapeHtml(user.minecraftUsername || 'Not linked')}</td>
            <td class="hide-mobile">${escapeHtml(user.application?.status || 'unsubmitted')}</td>
            <td>${escapeHtml(formatDate(user.createdAt))}</td>
          </tr>
        `).join('');
        $$('#usersTable tr').forEach((row) => {
          row.addEventListener('click', () => loadUserDetails(row.dataset.userId));
        });
      }

      async function loadUserDetails(discordUserId) {
        state.selectedUserId = discordUserId;
        $('#userDetails').textContent = 'Loading...';
        try {
          const data = await api(`/admin/api/users/${encodeURIComponent(discordUserId)}`);
          const player = data.profile?.player || {};
          const application = data.application?.application || {};
          const responses = data.application?.responses || [];
          const listedUser = state.users.find((user) => user.discordUserId === discordUserId);
          const responseByQuestion = new Map(responses.map((entry) => [entry.questionId, entry.response]));
          const responseDetails = state.applicationQuestions.map((question) => `
            <div class="fact">
              <span>${escapeHtml(question.prompt || question.label)}</span>
              <strong>${escapeHtml(responseByQuestion.get(question.id) || 'Unanswered')}</strong>
            </div>
          `).join('') || '<div class="fact"><span>Application questions</span><strong>Not configured</strong></div>';
          $('#userDetails').innerHTML = `
            <div class="fact"><span>Discord username</span><strong>${escapeHtml(listedUser?.discord?.username ? `@${listedUser.discord.username}` : 'Unknown')}</strong></div>
            <div class="fact"><span>Discord ID</span><strong>${escapeHtml(discordUserId)}</strong></div>
            <div class="fact"><span>Minecraft username</span><strong>${escapeHtml(player.minecraftUsername || 'Not linked')}</strong></div>
            <div class="fact"><span>XUID</span><strong>${escapeHtml(player.xuid || 'Unknown')}</strong></div>
            <div class="fact"><span>Application</span><strong>${escapeHtml(application.status || 'unsubmitted')}</strong></div>
            ${responseDetails}
            <div class="actions"><button class="danger" id="resetApplicationButton" type="button">Reset Application</button></div>
            <div id="userActionOutput" class="output"></div>
          `;
          $('#resetApplicationButton').addEventListener('click', async () => {
            $('#userActionOutput').textContent = 'Resetting...';
            try {
              const result = await api(`/admin/api/users/${encodeURIComponent(discordUserId)}/reset-application`, { method: 'POST', body: {} });
              $('#userActionOutput').textContent = JSON.stringify(result, null, 2);
              await loadUsers();
            } catch (err) {
              $('#userActionOutput').textContent = err.message;
            }
          });
        } catch (err) {
          $('#userDetails').textContent = err.message;
        }
      }

      async function refresh({ fullRefresh = true } = {}) {
        try {
          if (state.view === 'general') await loadGeneral();
          if (state.view === 'backend') await loadBackend();
          if (state.view === 'discord') await loadDiscord();
          if (state.view === 'minecraft') await loadMinecraftServer({ fullRefresh });
          if (state.view === 'users') await loadUsers();
        } catch (err) {
          const view = $(`#view-${state.view === 'minecraft' ? 'minecraft' : state.view}`);
          view.innerHTML = `<section class="panel"><strong>Unable to load.</strong><p class="muted">${escapeHtml(err.message)}</p></section>`;
        }
      }

      $$('.sidebar [data-view]').forEach((button) => {
        if (button.dataset.serverKey) return;
        button.addEventListener('click', () => setView(button.dataset.view));
      });
      $('#refreshButton').addEventListener('click', () => refresh({ fullRefresh: true }));

      loadMinecraftList().then(() => refresh());
      setInterval(() => {
        if (state.view === 'minecraft') loadMinecraftServer({ fullRefresh: false });
      }, 5000);
    </script>
  </body>
</html>
