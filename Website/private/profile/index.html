<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="{{faviconUrl}}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Profile - {{siteName}}</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(19, 29, 23, 0.84);
        --text: #f3f0e8;
        --muted: #c6c4b7;
        --line: rgba(255, 255, 255, 0.14);
        --gold: #d7b45f;
        --red: #cf766d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 75% 18%, rgba(215, 180, 95, 0.18), transparent 28rem),
          linear-gradient(150deg, #101411 0%, #1a2420 52%, #2b2519 100%);
      }
      .shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }
      .nav {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
      }
      .brand-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }
      .nav-actions {
        display: flex;
        gap: 14px;
      }
      .nav-actions a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 800;
      }
      .nav-button {
        border: 1px solid rgba(215, 180, 95, 0.58);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--text) !important;
      }
      .content {
        padding: 38px 0 80px;
      }
      .profile-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
        gap: 22px;
      }
      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 22px;
        border-radius: 8px;
      }
      h1, h2 { margin: 0 0 14px; }
      p { color: var(--muted); line-height: 1.55; }
      .facts {
        display: grid;
        gap: 12px;
      }
      .fact {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .fact span {
        color: var(--muted);
        display: block;
        font-size: 0.92rem;
      }
      .fact strong {
        display: block;
        margin-top: 4px;
        font-size: 1.12rem;
        overflow-wrap: anywhere;
      }
      .status {
        color: #ffffff;
        background: #151a16;
        border: 1px solid #f1d27a;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
        display: inline-flex;
        padding: 5px 8px;
        border-radius: 5px;
        font-weight: 800;
      }
      .error { color: var(--red); }
      @media (max-width: 820px) {
        .shell { width: min(100% - 28px, 1120px); }
        .profile-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="nav">
        <a class="brand" href="/">
          {{{brandLogo}}}<span>{{siteName}}</span>
        </a>
        <div class="nav-actions">
          {{{adminLink}}}
          <a href="/profile">Profile</a>
          <a href="/logout">Log out</a>
        </div>
      </nav>

      <section class="content">
        <div class="profile-grid">
          <section class="panel">
            <h1>Your Profile</h1>
            <p>Signed in as {{displayName}}.</p>
            <div class="facts">
              <div class="fact">
                <span>Discord username</span>
                <strong>{{discordUsername}}</strong>
              </div>
              <div class="fact">
                <span>Discord user ID</span>
                <strong>{{discordUserId}}</strong>
              </div>
              <div class="fact">
                <span>Application status</span>
                <strong><span class="status">{{applicationStatus}}</span></strong>
              </div>
            </div>
          </section>

          <section class="panel">
            <h2>Minecraft Account</h2>
            <div class="facts">
              <div class="fact">
                <span>Linked username</span>
                <strong>{{minecraftUsername}}</strong>
              </div>
              <div class="fact">
                <span>XUID</span>
                <strong>{{xuid}}</strong>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
