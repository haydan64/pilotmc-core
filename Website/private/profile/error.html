<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="{{faviconUrl}}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Profile - {{siteName}}</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #f3f0e8;
        --muted: #c6c4b7;
        --line: rgba(255, 255, 255, 0.14);
        --red: #cf766d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        background: linear-gradient(150deg, #101411 0%, #1a2420 52%, #2b2519 100%);
      }
      .panel {
        width: min(680px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        background: rgba(19, 29, 23, 0.84);
      }
      p { color: var(--muted); line-height: 1.55; }
      .error { color: var(--red); }
      a { color: var(--text); font-weight: 800; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Your Profile</h1>
      <p class="error">{{message}}</p>
      <p>The site could not load profile details from the server. Your Discord login is still active.</p>
      <p><a href="/">Home</a> | <a href="/logout">Log out</a></p>
    </main>
  </body>
</html>
